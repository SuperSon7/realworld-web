version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 26
    commands:
      - echo "Installing dependencies..."
      - corepack enable

  pre_build:
    commands:
      - echo "Running tests or linters (optional)..."

  build:
    commands:
      - echo "Building the application..."
      - pnpm install --frozen-lockfile
      - pnpm build

  post_build:
    commands:
      - echo "Syncing files to S3..."
      - aws s3 sync ./build s3://s3-kjb-cloudfront --delete
      - echo "Creating CloudFront invalidation..."
      - aws cloudfront create-invalidation --distribution-id arn:aws:cloudfront::E3I0ZLOOY1CJI1 --paths "/*"

artifacts:
  files:
    - '**/*'
  discard-paths: no
  base-directory: build
